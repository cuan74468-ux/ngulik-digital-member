name: CodeQL JavaScript security scan (read-only)
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngd-codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SARIF_DIR: ${{ runner.temp }}/codeql-sarif
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL for JavaScript
        uses: github/codeql-action/init@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze and keep SARIF on the runner (no security-alert writes)
        uses: github/codeql-action/analyze@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          category: /language:javascript-typescript
          upload: false
          output: ${{ runner.temp }}/codeql-sarif
      - name: Keep SARIF as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngd-codeql-sarif-${{ github.sha }}
          path: ${{ runner.temp }}/codeql-sarif/*.sarif
          if-no-files-found: error
          retention-days: 14
      - name: Fail on error or warning findings
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'),path=require('node:path');
          const dir=process.env.SARIF_DIR;
          if(!dir||!fs.existsSync(dir))throw Error('SARIF directory is missing: the scan produced no evidence.');
          const files=fs.readdirSync(dir).filter(f=>f.endsWith('.sarif'));
          if(!files.length)throw Error('No SARIF file found: the scan produced no evidence.');
          let blocking=0,notes=0;
          for(const file of files){
            const sarif=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
            for(const run of sarif.runs||[]){
              const ruleLevel={};
              for(const rule of (run.tool&&run.tool.driver&&run.tool.driver.rules)||[])
                ruleLevel[rule.id]=rule.defaultConfiguration&&rule.defaultConfiguration.level;
              for(const result of run.results||[]){
                const level=result.level||ruleLevel[result.ruleId]||'warning';
                if(level==='error'||level==='warning'){
                  blocking++;
                  const loc=(result.locations||[])[0]&&result.locations[0].physicalLocation||{};
                  const where=(loc.artifactLocation&&loc.artifactLocation.uri||'?')+':'+
                    (loc.region&&loc.region.startLine||'?');
                  console.error('CODEQL_FINDING',level,result.ruleId,where);
                }else notes++;
              }
            }
          }
          console.log('CODEQL_SUMMARY blocking='+blocking+' notes='+notes+' files='+files.length);
          if(blocking>0)process.exitCode=1;
          NODE
