name: Studio licensing isolated tests (no deploy)
on:
  push:
    branches: [studio-licensing-candidate]
permissions:
  contents: read
concurrency:
  group: ngd-studio-license-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test prototypes/studio-licensing/*.test.cjs
      - name: Existing backend and frontend unit regression suite (no deploy)
        run: node --test tests/*.test.cjs
      - name: Chromium portal licensing cards and actual API envelope
        run: node prototypes/studio-licensing/browser-run.mjs
      - name: Cross-repository contract with exact public Studio client and synthetic GAS
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/studio-cross-repo"
          mkdir -p "$fixture"
          git -C "$fixture" init -q
          git -C "$fixture" fetch --no-tags --depth=1 https://github.com/cuan74468-ux/linggau-ai-wrapper.git 49a7943d6f1a107790f07e8d0c132496e751bc30
          test "$(git -C "$fixture" rev-parse FETCH_HEAD)" = "49a7943d6f1a107790f07e8d0c132496e751bc30"
          git -C "$fixture" show FETCH_HEAD:prototypes/studio-licensing/client.mjs > "$fixture/client.mjs"
          STUDIO_CROSS_CLIENT="$fixture/client.mjs" node --test prototypes/studio-licensing/cross-repo-contract.cjs
