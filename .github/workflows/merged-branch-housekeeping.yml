name: Prune merged PR branches safely
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merged-branch-housekeeping.yml'
  pull_request:
    types: [closed]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: ngd-prune-merged-branches
  cancel-in-progress: false
jobs:
  prune:
    if: >-
      github.repository == 'cuan74468-ux/ngulik-digital-member' &&
      (github.event_name == 'push' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Remove only same-repository branches of verified merged PRs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          'use strict';
          const repo=process.env.GH_REPO,token=process.env.GH_TOKEN;
          if(repo!=='cuan74468-ux/ngulik-digital-member'||!token)
            throw Error('Unexpected repository or unavailable GitHub token');
          const base='https://api.github.com/repos/'+repo;
          async function api(path,method='GET'){
            const r=await fetch(base+path,{
              method,headers:{
                Authorization:'Bearer '+token,
                Accept:'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28'
              }
            });
            if(method==='DELETE'&&r.status===204)return null;
            if(!r.ok)throw Error('GitHub API '+method+' '+r.status+' at '+path.split('?')[0]);
            return r.json();
          }
          async function pages(path){
            const items=[];
            for(let p=1;p<=20;p++){
              const batch=await api(path+(path.includes('?')?'&':'?')+'per_page=100&page='+p);
              if(!Array.isArray(batch))throw Error('Unexpected GitHub API listing');
              items.push(...batch);
              if(batch.length<100)return items;
            }
            throw Error('Pagination limit exceeded; no unsafe partial cleanup');
          }
          async function main(){
            const [branches,prs]=await Promise.all([
              pages('/branches'),pages('/pulls?state=all')
            ]);
            const openHeads=new Set(prs.filter(x=>x.state==='open'&&
              x.head?.repo?.full_name===repo).map(x=>x.head.ref));
            const merged=new Map();
            for(const p of prs){
              if(!p.merged_at||p.base?.ref!=='main'||
                p.head?.repo?.full_name!==repo||!p.head?.ref||!p.head?.sha)continue;
              const name=p.head.ref;
              if(!merged.has(name))merged.set(name,[]);
              merged.get(name).push({pr:p.number,sha:p.head.sha});
            }
            let deleted=0,skipped=0,failed=0;
            for(const b of branches){
              const name=b.name,history=merged.get(name)||[];
              if(name==='main'||b.protected||openHeads.has(name)||
                /^(?:staging|production|release)(?:\/|$)/i.test(name)||
                !history.some(p=>p.sha===b.commit?.sha)){
                skipped++;
                console.log('KEEP '+name+': '+(openHeads.has(name)?'open PR':
                  history.length?'tip SHA or safety guard':'no merged PR'));
                continue;
              }
              const refPath='/git/ref/heads/'+name.split('/').map(encodeURIComponent).join('/');
              try{
                // Double-check the live ref before a destructive request.
                const live=await api(refPath);
                if(live.object?.sha!==b.commit.sha){
                  skipped++;console.log('KEEP '+name+': head changed');continue;
                }
                await api('/git/refs/heads/'+name.split('/').map(encodeURIComponent).join('/'),'DELETE');
                deleted++;
                console.log('DELETED '+name+' (merged PR #'+history.find(p=>p.sha===b.commit.sha).pr+')');
              }catch(e){
                failed++;console.error('FAILED '+name+': '+String(e.message).slice(0,160));
              }
            }
            console.log('BRANCH_HOUSEKEEPING_RESULT '+JSON.stringify({
              inspected:branches.length,deleted,kept:skipped,failed,
              openPullRequests:prs.filter(x=>x.state==='open').map(x=>x.number)
            }));
            if(failed)process.exitCode=1;
          }
          main().catch(e=>{console.error('BRANCH_HOUSEKEEPING_ABORT:',e.message);process.exitCode=1;});
          NODE
