name: Validate backend and frontend (no deploy)
on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - 'contracts/**'
      - 'staging/**'
      - 'index.html'
      - 'config.js'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - 'contracts/**'
      - 'staging/**'
      - 'index.html'
      - 'config.js'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngd-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js for tests only — no build
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify pure backend rules and frontend smoke
        run: node --test tests/*.test.cjs
      - name: Smoke-test static UI in real headless Chrome (no deployment)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Report the exact browser assertion/command rather than hiding the
          # Chrome stderr behind a truncated workflow log.
          trap 'code=$?; echo "BROWSER_SMOKE_FAILED exit=$code line=$LINENO command=$BASH_COMMAND" >&2; if test -f /tmp/ngd-chrome.log; then tail -n 35 /tmp/ngd-chrome.log >&2; fi; if test -f /tmp/ngd-http.log; then tail -n 10 /tmp/ngd-http.log >&2; fi' ERR
          # Add a CI-only probe; repository index.html itself remains unchanged.
          sed -i 's#</body>#<script src="./tests/layout-probe.js" defer></script><script src="./tests/browser-readonly-api.js" defer></script><script src="./tests/home-layout-probe.js" defer></script><script src="./tests/public-v8-browser-probe.js" defer></script></body>#' index.html
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ngd-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/; then break; fi
            sleep 0.5
          done
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          # A separate ephemeral profile per headless invocation avoids
          # cross-run session locks/crashes. None contains production credentials.
          run_chrome() {
            local profile status
            profile="$(mktemp -d)"
            status=0
            "$CHROME" --user-data-dir="$profile" --no-first-run --no-default-browser-check "$@" || status=$?
            rm -rf "$profile"
            return "$status"
          }
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1440,900 --dump-dom \
            "http://127.0.0.1:8765/" > /tmp/ngd-guest.html 2>/tmp/ngd-chrome.log
          echo 'GUEST_BROWSE_PROBE:'
          grep -Eo 'class="nh-hero[^"]*"|class="ngd-shop-hero-art"|data-experience-v2="[^"]*"|data-app-role="[^"]*"|data-overflow="[^"]*"' /tmp/ngd-guest.html | tail -12 || true
          grep -q 'class="nh-hero public-editorial-hero pf-portfolio-hero pf-home-minimal ngd-shop-hero ngd-home-quiet-hero"' /tmp/ngd-guest.html
          grep -q 'class="ngd-home-direct-links"' /tmp/ngd-guest.html
          grep -q 'Ngulik Digital' /tmp/ngd-guest.html
          grep -q 'data-experience-v2="true"' /tmp/ngd-guest.html
          grep -q 'data-home-columns-clear="true"' /tmp/ngd-guest.html
          grep -q 'data-home-header-clear="true"' /tmp/ngd-guest.html
          grep -q 'data-home-art-absent="true"' /tmp/ngd-guest.html
          grep -q 'data-home-no-products="true"' /tmp/ngd-guest.html
          echo 'DESKTOP_HOME_GEOMETRY:'
          grep -oE '<output id="qa-home-geometry"[^>]*>[^<]*' /tmp/ngd-guest.html | cut -c1-1400 || true
          grep -q 'data-home-header-anchored="true"' /tmp/ngd-guest.html
          grep -q 'data-home-hero-wide="true"' /tmp/ngd-guest.html
          echo 'DESKTOP_MARKETPLACE_LAYOUT:'
          grep -oE 'LAYOUT_CHECK[^<]+' /tmp/ngd-guest.html | cut -c1-1300 || true
          grep -q 'data-overflow="false"' /tmp/ngd-guest.html
          echo 'DESKTOP_HERO_GEOMETRY_OK'
          echo 'GUEST_BROWSER_QA_OK'
          # Brand V10: real transparent icon, OTP-only member login and AI route.
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom "http://127.0.0.1:8765/#login" > /tmp/ngd-login-v10.html 2>>/tmp/ngd-chrome.log
          grep -q 'class="login-shell ngd-auth-v10"' /tmp/ngd-login-v10.html
          grep -q 'id="login-otp"' /tmp/ngd-login-v10.html
          grep -q 'Member tidak perlu membuat PIN' /tmp/ngd-login-v10.html
          grep -q 'ngd-icon-v10-192.png' /tmp/ngd-login-v10.html
          grep -q 'data-overflow="false"' /tmp/ngd-login-v10.html
          if grep -q 'id="pin"' /tmp/ngd-login-v10.html; then echo 'LOGIN_V10_FAIL: Member PIN shown' >&2; exit 1; fi
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom "http://127.0.0.1:8765/?preview=member#ai" > /tmp/ngd-member-ai-v10.html 2>>/tmp/ngd-chrome.log
          grep -Fq '<h1>Pilih alat. Mulai berkarya.</h1>' /tmp/ngd-member-ai-v10.html
          grep -q 'id="ai-tool-cards"' /tmp/ngd-member-ai-v10.html
          grep -q 'data-route="ai" aria-current="page"' /tmp/ngd-member-ai-v10.html
          grep -q 'data-overflow="false"' /tmp/ngd-member-ai-v10.html
          echo 'BRAND_OTP_STUDIO_V10_BROWSER_OK'
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1440,900 --dump-dom "http://127.0.0.1:8765/#affiliate" > /tmp/ngd-affiliate-v8.html 2>>/tmp/ngd-chrome.log
          grep -q 'class="partner-public"' /tmp/ngd-affiliate-v8.html
          grep -q 'data-v8-affiliate-cohesive="true"' /tmp/ngd-affiliate-v8.html
          grep -q 'data-overflow="false"' /tmp/ngd-affiliate-v8.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom "http://127.0.0.1:8765/#dukungan" > /tmp/ngd-help-v8.html 2>>/tmp/ngd-chrome.log
          grep -q 'class="ngd-public-help"' /tmp/ngd-help-v8.html
          grep -q 'data-v8-help-faq="5"' /tmp/ngd-help-v8.html
          grep -q 'data-overflow="false"' /tmp/ngd-help-v8.html
          if grep -q 'id="support-create-form"' /tmp/ngd-help-v8.html; then
            echo 'ERROR: public Help exposed a member-only ticket form' >&2
            exit 1
          fi
          echo 'PUBLIC_V8_AFFILIATE_HELP_OK'
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1440,900 --dump-dom "http://127.0.0.1:8765/#jasa" > /tmp/ngd-public-services-v8.html 2>>/tmp/ngd-chrome.log
          grep -q 'class="ngd-public-services ngd-service-guide"' /tmp/ngd-public-services-v8.html
          grep -q 'class="ngd-service-guide-head"' /tmp/ngd-public-services-v8.html
          grep -q 'Website &amp; Katalog Online' /tmp/ngd-public-services-v8.html
          if grep -q 'market-product-card' /tmp/ngd-public-services-v8.html; then
            echo 'SERVICE_BROWSER_FAIL: catalog renderer leaked into Jasa' >&2; exit 1
          fi
          grep -q 'data-overflow="false"' /tmp/ngd-public-services-v8.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom "http://127.0.0.1:8765/#ai" > /tmp/ngd-public-ai-v8.html 2>>/tmp/ngd-chrome.log
          grep -q 'class="ai-catalog"' /tmp/ngd-public-ai-v8.html
          grep -q 'class="ai-catalog-intro"' /tmp/ngd-public-ai-v8.html
          grep -q 'data-overflow="false"' /tmp/ngd-public-ai-v8.html
          echo 'PUBLIC_V8_SERVICES_AI_OK'
          if grep -q 'DEMO LOKAL\|Pratinjau — bukan data transaksi' /tmp/ngd-guest.html; then
            echo 'ERROR: internal development banner leaked to public page' >&2
            exit 1
          fi
          # V16 top-only navigation, real member dashboard and role-aware drawer.
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member" > /tmp/ngd-member.html 2>>/tmp/ngd-chrome.log
          grep -q 'class="ngd-member-home ngd-member-command"' /tmp/ngd-member.html
          grep -q 'class="member-welcome ngd-member-hero"' /tmp/ngd-member.html
          grep -q 'aria-label="Dompet Token Universal"' /tmp/ngd-member.html
          grep -q 'class="ngd-member-stats"' /tmp/ngd-member.html
          grep -q 'class="ngd-member-activity"' /tmp/ngd-member.html
          grep -q 'id="top-nav-trigger"' /tmp/ngd-member.html
          grep -q 'id="top-nav-drawer"' /tmp/ngd-member.html
          grep -q 'data-route="pesanan"' /tmp/ngd-member.html
          if grep -q 'id="mobile-nav"' /tmp/ngd-member.html; then
            echo 'MOBILE_P0_FAIL: deprecated bottom navigation in DOM' >&2; exit 1
          fi
          grep -q 'data-overflow="false"' /tmp/ngd-member.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#pengaturan" > /tmp/ngd-admin-drawer.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="top-nav-drawer"' /tmp/ngd-admin-drawer.html
          grep -q 'data-route="pengaturan"' /tmp/ngd-admin-drawer.html
          if grep -q 'id="mobile-nav"' /tmp/ngd-admin-drawer.html; then
            echo 'MOBILE_P0_FAIL: admin bottom tabs' >&2; exit 1
          fi
          echo 'TOP_ONLY_NAV_QA_OK: member and admin have a single header drawer'
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#katalog" > /tmp/ngd-catalog.html 2>>/tmp/ngd-chrome.log
          # Runtime storefront uses only API data: no built-in test offers.
          grep -q 'data-v8-broken-images="0"' /tmp/ngd-catalog.html
          grep -q 'data-v8-archived-visible="false"' /tmp/ngd-catalog.html
          # Member's personal catalog must not duplicate the public retail campaign.
          if grep -q 'class="ngd-catalog-campaign"' /tmp/ngd-catalog.html; then
            echo 'CATALOG_BROWSER_FAIL: public sales hero leaked into member workspace' >&2
            exit 1
          fi
          if ! grep -Eq 'Katalog untuk kebutuhan Anda|Katalog belum tersedia' /tmp/ngd-catalog.html; then
            echo 'CATALOG_BROWSER_FAIL: expected catalogue heading missing' >&2
            grep -o -E '<h1[^>]*>[^<]*|<h2[^>]*>[^<]*|Katalog[^<]*|<section id="screen"[^>]*' /tmp/ngd-catalog.html | head -12 || true
            exit 1
          fi
          echo 'CATALOG_BROWSER_HEADING_OK'
          if grep -q 'CRS-DEMO\|ORDER-CONTOH\|P-VIDEO-AI' /tmp/ngd-catalog.html; then
            echo 'ERROR: QA fixture leaked into storefront DOM' >&2
            exit 1
          fi
          if ! grep -q 'data-overflow="false"' /tmp/ngd-catalog.html; then
            echo 'CATALOG_BROWSER_FAIL: responsive overflow or layout probe missing' >&2
            grep -o -E 'data-overflow="[^"]*"' /tmp/ngd-catalog.html | tail -3 || true
            exit 1
          fi
          if ! grep -q 'data-checkout-safe="true"' /tmp/ngd-catalog.html; then
            echo 'CATALOG_BROWSER_FAIL: unverified QRIS payment controls appeared while finance OFF' >&2
            grep -o -E 'data-checkout-safe="[^"]*"' /tmp/ngd-catalog.html | tail -3 || true
            exit 1
          fi
          echo 'CATALOG_BROWSER_QA_OK'
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4500 --window-size=390,844 --dump-dom "http://127.0.0.1:8765/#katalog" > /tmp/ngd-catalog-mobile-v9.html 2>>/tmp/ngd-chrome.log
          grep -q 'class="ngd-catalog-campaign"' /tmp/ngd-catalog-mobile-v9.html
          grep -q 'data-v9-campaign-art-loaded="true"' /tmp/ngd-catalog-mobile-v9.html
          grep -q 'data-overflow="false"' /tmp/ngd-catalog-mobile-v9.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --window-size=1280,800 --dump-dom "http://127.0.0.1:8765/?preview=admin#konten" > /tmp/ngd-admin-cms-v9.html 2>>/tmp/ngd-chrome.log
          grep -q 'class="ngd-cms-campaign-status"' /tmp/ngd-admin-cms-v9.html
          grep -q 'data-content-create="catalog"' /tmp/ngd-admin-cms-v9.html
          grep -q 'data-content-asset="assets/media/ngd-catalog-v9-wide.webp"' /tmp/ngd-admin-cms-v9.html
          grep -q 'data-overflow="false"' /tmp/ngd-admin-cms-v9.html
          echo 'CATALOG_V9_DESKTOP_MOBILE_ADMIN_OK'
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#dukungan" > /tmp/ngd-support-member.html 2>>/tmp/ngd-chrome.log
          echo 'SUPPORT_BROWSER_QA_PROBE:'
          grep -Eo 'id="support-create-form"|Fitur support belum diaktifkan|Kirim laporan|Bantuan[^<]{0,70}|data-overflow="[^"]*"' /tmp/ngd-support-member.html | head -18 || true
          grep -q 'id="support-create-form"' /tmp/ngd-support-member.html
          grep -q 'Kirim laporan' /tmp/ngd-support-member.html
          grep -q 'data-overflow="false"' /tmp/ngd-support-member.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#member" > /tmp/ngd-support-admin.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="member-search-form"' /tmp/ngd-support-admin.html
          grep -q 'Cari member' /tmp/ngd-support-admin.html
          grep -q 'data-overflow="false"' /tmp/ngd-support-admin.html
          echo 'SUPPORT_ADMIN_BROWSER_OK'
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#belajar" > /tmp/ngd-lms-member.html 2>>/tmp/ngd-chrome.log
          grep -q 'RUANG MEMBER / KELAS SAYA' /tmp/ngd-lms-member.html
          grep -q 'Fondasi Digital untuk UMKM' /tmp/ngd-lms-member.html
          grep -q 'data-overflow="false"' /tmp/ngd-lms-member.html
          grep -q 'id="top-nav-drawer"' /tmp/ngd-lms-member.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#lms-course" > /tmp/ngd-lms-reader.html 2>>/tmp/ngd-chrome.log
          grep -q 'Menyiapkan Profil Usaha' /tmp/ngd-lms-reader.html
          grep -q 'data-overflow="false"' /tmp/ngd-lms-reader.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#lms" > /tmp/ngd-lms-admin.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="lms-course-form"' /tmp/ngd-lms-admin.html
          grep -q 'id="lms-course-form"' /tmp/ngd-lms-admin.html
          grep -q 'data-overflow="false"' /tmp/ngd-lms-admin.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#lms-editor" > /tmp/ngd-lms-workspace.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="lms-ai-form"' /tmp/ngd-lms-workspace.html
          grep -q 'Ruang Materi' /tmp/ngd-lms-workspace.html
          grep -q 'data-overflow="false"' /tmp/ngd-lms-workspace.html
          grep -q 'data-member-theme="true"' /tmp/ngd-lms-member.html
          grep -q 'data-unified-theme="true"' /tmp/ngd-lms-member.html
          grep -q 'data-unified-theme="true"' /tmp/ngd-lms-reader.html
          echo 'LMS_BROWSER_QA_OK'
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#lms-complete" > /tmp/ngd-lms-success.html 2>>/tmp/ngd-chrome.log
          grep -q 'Pelajaran Selesai!' /tmp/ngd-lms-success.html
          grep -q 'Progres belajar belum tercatat' /tmp/ngd-lms-success.html
          grep -q 'member-success-receipt' /tmp/ngd-lms-success.html
          grep -q 'data-unified-theme="true"' /tmp/ngd-lms-success.html
          grep -q 'data-overflow="false"' /tmp/ngd-lms-success.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3750 --window-size=375,812 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#dukungan" > /tmp/ngd-support-375.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="support-create-form"' /tmp/ngd-support-375.html
          grep -q 'data-unified-theme="true"' /tmp/ngd-support-375.html
          grep -q 'data-overflow="false"' /tmp/ngd-support-375.html
          grep -q 'data-unified-theme="true"' /tmp/ngd-support-375.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#lms" > /tmp/ngd-admin-unchanged.html 2>>/tmp/ngd-chrome.log
          grep -q 'data-member-theme="false"' /tmp/ngd-admin-unchanged.html
          grep -q 'data-overflow="false"' /tmp/ngd-admin-unchanged.html
          grep -q 'id="top-nav-trigger"' /tmp/ngd-admin-unchanged.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#akun" > /tmp/ngd-member-account.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="profile-form"' /tmp/ngd-member-account.html
          grep -q 'Pusat notifikasi member' /tmp/ngd-member-account.html
          grep -q 'Simpan perubahan' /tmp/ngd-member-account.html
          grep -q 'data-overflow="false"' /tmp/ngd-member-account.html
          echo 'ACCOUNT_BROWSER_QA_OK'
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#akun" > /tmp/ngd-admin-account.html 2>>/tmp/ngd-chrome.log
          if grep -q 'id="profile-form"' /tmp/ngd-admin-account.html; then
            echo 'ERROR: admin was shown member profile editor' >&2
            exit 1
          fi
          # Desktop/member/admin share exact color tokens and dark active nav.
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#beranda" > /tmp/ngd-member-desktop.html 2>>/tmp/ngd-chrome.log
          grep -q 'data-unified-theme="true"' /tmp/ngd-member-desktop.html
          grep -q 'data-ink-navigation="true"' /tmp/ngd-member-desktop.html
          grep -q 'class="ngd-member-home ngd-member-command"' /tmp/ngd-member-desktop.html
          grep -q 'member-marketplace-v7.css' /tmp/ngd-member-desktop.html
          grep -q 'data-overflow="false"' /tmp/ngd-member-desktop.html
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#admin" > /tmp/ngd-admin-desktop.html 2>>/tmp/ngd-chrome.log
          grep -q 'data-unified-theme="true"' /tmp/ngd-admin-desktop.html
          grep -q 'data-ink-navigation="true"' /tmp/ngd-admin-desktop.html
          grep -q 'data-overflow="false"' /tmp/ngd-admin-desktop.html
          echo 'DESKTOP_BROWSER_QA_OK'
          run_chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/#beranda" > /tmp/ngd-guest-mobile.html 2>>/tmp/ngd-chrome.log
          echo 'GUEST_MOBILE_FLAGS:'
          grep -Eo 'data-(unified-theme|ink-navigation|mobile-nav|overflow|home-order|home-header-clear)="[^"]*"' /tmp/ngd-guest-mobile.html | tail -16 || true
          echo 'GUEST_MOBILE_GEOMETRY:'
          grep -oE '<output id="qa-home-geometry"[^>]*>[^<]*' /tmp/ngd-guest-mobile.html | cut -c1-1200 || true
          grep -q 'data-unified-theme="true"' /tmp/ngd-guest-mobile.html
          grep -q 'data-ink-navigation="true"' /tmp/ngd-guest-mobile.html
          grep -q 'id="top-nav-trigger"' /tmp/ngd-guest-mobile.html
          grep -q 'data-overflow="false"' /tmp/ngd-guest-mobile.html
          grep -q 'data-overflow="false"' /tmp/ngd-guest-mobile.html
          grep -q 'class="ngd-home-direct-links"' /tmp/ngd-guest-mobile.html
          grep -q 'data-home-art-absent="true"' /tmp/ngd-guest-mobile.html
