name: Validate backend and frontend (no deploy)
on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - 'index.html'
      - 'config.js'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - 'index.html'
      - 'config.js'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngd-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js for tests only — no build
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify pure backend rules and frontend smoke
        run: node --test tests/*.test.cjs
      - name: Smoke-test static UI in real headless Chrome (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          # Add a CI-only probe; repository index.html itself remains unchanged.
          sed -i 's#</body>#<script src="./tests/layout-probe.js" defer></script><script src="./tests/browser-readonly-api.js" defer></script></body>#' index.html
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ngd-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/; then break; fi
            sleep 0.5
          done
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --dump-dom \
            "http://127.0.0.1:8765/" > /tmp/ngd-guest.html 2>/tmp/ngd-chrome.log
          grep -q 'class="nh-hero"' /tmp/ngd-guest.html
          grep -q 'class="nh-grid"' /tmp/ngd-guest.html
          grep -q 'Ngulik Digital' /tmp/ngd-guest.html
          if grep -q 'DEMO LOKAL\|Pratinjau — bukan data transaksi' /tmp/ngd-guest.html; then
            echo 'ERROR: internal development banner leaked to public page' >&2
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member" > /tmp/ngd-member.html 2>>/tmp/ngd-chrome.log
          grep -q 'RUANG BELAJAR PRIBADI' /tmp/ngd-member.html
          grep -q 'Kredit AI tersisa' /tmp/ngd-member.html
          grep -q 'data-overflow="false"' /tmp/ngd-member.html
          grep -q 'data-floating-nav="true"' /tmp/ngd-member.html
          grep -q 'data-mobile-nav="true"' /tmp/ngd-member.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#katalog" > /tmp/ngd-catalog.html 2>>/tmp/ngd-chrome.log
          grep -q 'Paket 3-in-1' /tmp/ngd-catalog.html
          grep -q 'Jasa Video Iklan AI' /tmp/ngd-catalog.html
          grep -q 'Bundel Ebook Vibe Coder' /tmp/ngd-catalog.html
          grep -q 'data-catalog-filter="jasa"' /tmp/ngd-catalog.html
          grep -q 'Belum tersedia untuk pemesanan' /tmp/ngd-catalog.html
          grep -q 'Paket 3-in-1' /tmp/ngd-catalog.html
          grep -q 'data-overflow="false"' /tmp/ngd-catalog.html
          grep -q 'data-buys-disabled="true"' /tmp/ngd-catalog.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#dukungan" > /tmp/ngd-support-member.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="support-create-form"' /tmp/ngd-support-member.html
          grep -q 'Fitur support belum diaktifkan' /tmp/ngd-support-member.html
          grep -q 'data-overflow="false"' /tmp/ngd-support-member.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#member" > /tmp/ngd-support-admin.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="member-search-form"' /tmp/ngd-support-admin.html
          grep -q 'Buka Member 360°' /tmp/ngd-support-admin.html
          grep -q 'data-overflow="false"' /tmp/ngd-support-admin.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#belajar" > /tmp/ngd-lms-member.html 2>>/tmp/ngd-chrome.log
          grep -q 'Kelas dan perjalanan belajar' /tmp/ngd-lms-member.html
          grep -q 'Fondasi Digital untuk UMKM' /tmp/ngd-lms-member.html
          grep -q 'data-overflow="false"' /tmp/ngd-lms-member.html
          grep -q 'data-floating-nav="true"' /tmp/ngd-lms-member.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#lms-course" > /tmp/ngd-lms-reader.html 2>>/tmp/ngd-chrome.log
          grep -q 'Menyiapkan Profil Usaha' /tmp/ngd-lms-reader.html
          grep -q 'data-overflow="false"' /tmp/ngd-lms-reader.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#lms" > /tmp/ngd-lms-admin.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="lms-course-form"' /tmp/ngd-lms-admin.html
          grep -q 'Penyuntingan kursus belum tersedia' /tmp/ngd-lms-admin.html
          grep -q 'data-overflow="false"' /tmp/ngd-lms-admin.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#lms-editor" > /tmp/ngd-lms-workspace.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="lms-ai-form"' /tmp/ngd-lms-workspace.html
          grep -q 'Ruang Materi' /tmp/ngd-lms-workspace.html
          grep -q 'data-overflow="false"' /tmp/ngd-lms-workspace.html
          grep -q 'data-member-theme="true"' /tmp/ngd-lms-member.html
          grep -q 'data-unified-theme="true"' /tmp/ngd-lms-member.html
          grep -q 'data-unified-theme="true"' /tmp/ngd-lms-reader.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#lms-complete" > /tmp/ngd-lms-success.html 2>>/tmp/ngd-chrome.log
          grep -q 'Pelajaran selesai!' /tmp/ngd-lms-success.html
          grep -q 'Progres belajar belum tercatat' /tmp/ngd-lms-success.html
          grep -q 'member-success-receipt' /tmp/ngd-lms-success.html
          grep -q 'data-unified-theme="true"' /tmp/ngd-lms-success.html
          grep -q 'data-overflow="false"' /tmp/ngd-lms-success.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3750 --window-size=375,812 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#dukungan" > /tmp/ngd-support-375.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="support-create-form"' /tmp/ngd-support-375.html
          grep -q 'data-unified-theme="true"' /tmp/ngd-support-375.html
          grep -q 'data-overflow="false"' /tmp/ngd-support-375.html
          grep -q 'data-unified-theme="true"' /tmp/ngd-support-375.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#lms" > /tmp/ngd-admin-unchanged.html 2>>/tmp/ngd-chrome.log
          grep -q 'data-member-theme="false"' /tmp/ngd-admin-unchanged.html
          grep -q 'data-overflow="false"' /tmp/ngd-admin-unchanged.html
          grep -q 'data-floating-nav="true"' /tmp/ngd-admin-unchanged.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#akun" > /tmp/ngd-member-account.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="profile-form"' /tmp/ngd-member-account.html
          grep -q 'Pusat notifikasi member' /tmp/ngd-member-account.html
          grep -q 'Penyimpanan perubahan profil saat ini belum tersedia' /tmp/ngd-member-account.html
          grep -q 'data-overflow="false"' /tmp/ngd-member-account.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#akun" > /tmp/ngd-admin-account.html 2>>/tmp/ngd-chrome.log
          if grep -q 'id="profile-form"' /tmp/ngd-admin-account.html; then
            echo 'ERROR: admin was shown member profile editor' >&2
            exit 1
          fi
          # Desktop/member/admin share exact color tokens and dark active nav.
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#beranda" > /tmp/ngd-member-desktop.html 2>>/tmp/ngd-chrome.log
          grep -q 'data-unified-theme="true"' /tmp/ngd-member-desktop.html
          grep -q 'data-ink-navigation="true"' /tmp/ngd-member-desktop.html
          grep -q 'data-overflow="false"' /tmp/ngd-member-desktop.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#admin" > /tmp/ngd-admin-desktop.html 2>>/tmp/ngd-chrome.log
          grep -q 'data-unified-theme="true"' /tmp/ngd-admin-desktop.html
          grep -q 'data-ink-navigation="true"' /tmp/ngd-admin-desktop.html
          grep -q 'data-overflow="false"' /tmp/ngd-admin-desktop.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/#beranda" > /tmp/ngd-guest-mobile.html 2>>/tmp/ngd-chrome.log
          grep -q 'data-unified-theme="true"' /tmp/ngd-guest-mobile.html
          grep -q 'data-ink-navigation="true"' /tmp/ngd-guest-mobile.html
          grep -q 'data-floating-nav="true"' /tmp/ngd-guest-mobile.html
          grep -q 'data-overflow="false"' /tmp/ngd-guest-mobile.html
          grep -q 'data-overflow="false"' /tmp/ngd-guest-mobile.html
          grep -q 'class="nh-grid"' /tmp/ngd-guest-mobile.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#admin" > /tmp/ngd-admin-mobile.html 2>>/tmp/ngd-chrome.log
          grep -q 'data-unified-theme="true"' /tmp/ngd-admin-mobile.html
          grep -q 'data-ink-navigation="true"' /tmp/ngd-admin-mobile.html
          grep -q 'data-floating-nav="true"' /tmp/ngd-admin-mobile.html
          grep -q 'data-overflow="false"' /tmp/ngd-admin-mobile.html
          # New catalogue admin CRUD must render safely and stay locked on demo.
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#produk" > /tmp/ngd-admin-catalog-mobile.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="admin-catalog-form"' /tmp/ngd-admin-catalog-mobile.html
          grep -q '8 produk tercatat' /tmp/ngd-admin-catalog-mobile.html
          grep -q 'Pengelolaan katalog belum diaktifkan' /tmp/ngd-admin-catalog-mobile.html
          grep -q 'data-overflow="false"' /tmp/ngd-admin-catalog-mobile.html
          grep -q 'data-ink-navigation="true"' /tmp/ngd-admin-catalog-mobile.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1280,800 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#produk" > /tmp/ngd-admin-catalog-desktop.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="admin-catalog-form"' /tmp/ngd-admin-catalog-desktop.html
          grep -q 'data-overflow="false"' /tmp/ngd-admin-catalog-desktop.html
          grep -q 'data-unified-theme="true"' /tmp/ngd-admin-catalog-desktop.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/#produk" > /tmp/ngd-public-no-admin.html 2>>/tmp/ngd-chrome.log
          if grep -q 'id="admin-catalog-form"' /tmp/ngd-public-no-admin.html; then
            echo 'ERROR: catalogue editor visible to public' >&2
            exit 1
          fi
          # Production-oriented service request UI is safe and responsive in both roles.
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=member#jasa" > /tmp/ngd-member-services.html 2>>/tmp/ngd-chrome.log
          grep -q 'id="service-brief-form"' /tmp/ngd-member-services.html
          grep -q 'Pengiriman permintaan jasa saat ini belum tersedia' /tmp/ngd-member-services.html
          grep -q 'data-overflow="false"' /tmp/ngd-member-services.html
          grep -q 'data-floating-nav="true"' /tmp/ngd-member-services.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/?preview=admin#layanan" > /tmp/ngd-admin-services.html 2>>/tmp/ngd-chrome.log
          grep -q 'Permintaan jasa dan penawaran' /tmp/ngd-admin-services.html
          grep -q 'Antrean kosong' /tmp/ngd-admin-services.html
          grep -q 'data-overflow="false"' /tmp/ngd-admin-services.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --dump-dom \
            "http://127.0.0.1:8765/#layanan" > /tmp/ngd-guest-services.html 2>>/tmp/ngd-chrome.log
          if grep -q 'id="service-quote-form"' /tmp/ngd-guest-services.html; then
            echo 'ERROR: service quote editor visible to visitor' >&2
            exit 1
          fi
          # Live API browser check is informative only: external network/CORS is
          # independently gated from deterministic frontend tests and no writes occur.
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=17000 --window-size=900,700 --dump-dom \
            "http://127.0.0.1:8765/?api-check=1" > /tmp/ngd-browser-api.html 2>>/tmp/ngd-chrome.log || true
          if grep -q 'API_BROWSER_READ_OK' /tmp/ngd-browser-api.html; then
            echo 'BROWSER_API_TRANSPORT_OK: read-only POST to GAS succeeded'
          else
            echo 'BROWSER_API_TRANSPORT_UNVERIFIED: inspect browser CORS/redirect/network before enabling login or payments'
            grep -o 'API_BROWSER_[A-Z_]*' /tmp/ngd-browser-api.html | tail -1 || true
          fi
          echo 'BROWSER_UI_OK: membership public, member, admin, catalog and service flows'
