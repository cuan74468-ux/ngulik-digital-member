name: Validate backend and frontend (no deploy)
on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - 'contracts/**'
      - 'staging/**'
      - 'index.html'
      - 'config.js'
      - '404.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'package.json'
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - 'SECURITY.md'
      - 'PROJECT_CONTROL.md'
  pull_request:
    branches: [main]
    paths:
      - 'apps-script/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/**'
      - 'contracts/**'
      - 'staging/**'
      - 'index.html'
      - 'config.js'
      - '404.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'package.json'
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - 'SECURITY.md'
      - 'PROJECT_CONTROL.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngd-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js for tests only — no build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify pure backend rules and frontend smoke
        run: node --test tests/*.test.cjs
      - name: Smoke-test static UI in real headless Chrome (no deployment)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ngd-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/; then break; fi
            sleep 0.3
          done
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          # Actual 360 x 800 Chrome DevTools viewport: overflow, contrast, nine routes, single navigation.
          CHROME="$CHROME" node tests/mobile-360-cdp.cjs
          # DOM smoke confirms the current experience, rather than obsolete 16 November hero markup.
          run_chrome() {
            local profile status
            profile="$(mktemp -d)"
            status=0
            "$CHROME" --user-data-dir="$profile" --no-first-run --no-default-browser-check --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6500 --window-size=390,844 --dump-dom "$1" > "$2" 2>/tmp/ngd-browser-smoke.log || status=$?
            rm -rf "$profile"
            return "$status"
          }
          run_chrome 'http://127.0.0.1:8765/' /tmp/ngd-guest.html
          # A live public CMS can be genuinely unavailable. Accept a clearly
          # rendered service-state panel, but never an empty #screen.
          grep -Eq 'class="ngd-landing-v1( |")' /tmp/ngd-guest.html
          grep -q 'id="screen"' /tmp/ngd-guest.html
          grep -q 'data-route="daftar"' /tmp/ngd-guest.html
          run_chrome 'http://127.0.0.1:8765/?preview=member#beranda' /tmp/ngd-member.html
          grep -q 'class="ngdm-dashboard"' /tmp/ngd-member.html
          grep -q 'ngdm-wallet-chart' /tmp/ngd-member.html
          run_chrome 'http://127.0.0.1:8765/staging/member.html#login' /tmp/ngd-staging-login.html
          grep -q 'data-mode="login"' /tmp/ngd-staging-login.html
          grep -q 'data-action="member-otp-request"' /tmp/ngd-staging-login.html
          run_chrome 'http://127.0.0.1:8765/staging/member.html#daftar' /tmp/ngd-staging-register.html
          grep -q 'data-mode="register"' /tmp/ngd-staging-register.html
          grep -q 'data-action="otp-request"' /tmp/ngd-staging-register.html
          echo 'NGD_BROWSER_SMOKE_PASS: guest storefront, native member dashboard, STAGING OTP login and signup, 360px device checks'

      - name: Upload real Chrome mobile 360 screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngd-mobile-360-${{ github.sha }}
          path: mobile-qa-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
