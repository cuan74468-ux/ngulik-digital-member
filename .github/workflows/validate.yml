name: Validate backend and frontend (no deploy)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngd-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js for tests only — no build
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify pure backend rules and frontend smoke
        run: node --test tests/backend-pure.test.cjs tests/backend-security.test.cjs tests/backend-finance-safety.test.cjs tests/backend-payment-policy.test.cjs tests/backend-affiliate-safety.test.cjs tests/backend-fulfillment.test.cjs tests/frontend-smoke.test.cjs tests/static-contract.test.cjs
