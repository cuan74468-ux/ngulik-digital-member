name: Read-only check of connected membership API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-live-api.yml"
      - "config.js"
permissions:
  contents: read
jobs:
  verify_api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public GAS endpoint identity (GET only, zero data writes)
        env:
          NGD_GAS_URL: "https://script.google.com/macros/s/AKfycbyQlhsRDfoHLIHaalBsBos5jJhvPmG3J8B0Al9XrqvUwBQkcnr8uzYRlpcjGlgC_-Xr/exec"
        run: |
          set -euo pipefail
          curl -fLSs --connect-timeout 8 --max-time 25 \
            -H "Accept: application/json" \
            --output /tmp/ngd-api-check.json "$NGD_GAS_URL"
          python3 - <<'PY'
          import json
          with open('/tmp/ngd-api-check.json',encoding='utf-8') as f:
              d=json.load(f)
          if d.get('ok') is not True:
              raise SystemExit('API_CHECK_FAIL: Web app did not return a successful Ngulik Digital response.')
          info=d.get('data') or {}
          if info.get('app')!='Ngulik Digital API':
              raise SystemExit('API_CHECK_FAIL: Web app identity differs from Ngulik Digital API.')
          for field in ('version','writes_enabled','payments_enabled'):
              if field not in info:
                  raise SystemExit('API_CHECK_FAIL: Missing response field '+field)
          print('API_GET_OK: Ngulik Digital API identity confirmed.')
          print('API_VERSION:', str(info['version'])[:45])
          print('MUTATIONS_ENABLED:', bool(info['writes_enabled']))
          print('PAYMENTS_ENABLED:', bool(info['payments_enabled']))
          print('NOTE: GET proves identity only; it does NOT validate the database, login, CORS, or payment.')
          PY
      - name: Verify read-only POST methods and live catalog (no registrations or orders)
        env:
          NGD_GAS_URL: "https://script.google.com/macros/s/AKfycbyQlhsRDfoHLIHaalBsBos5jJhvPmG3J8B0Al9XrqvUwBQkcnr8uzYRlpcjGlgC_-Xr/exec"
        run: |
          set -euo pipefail
          for action in getPublicInfo getKatalog; do
            printf '{"action":"%s","payload":{},"token":"","request_id":"READONLY_GITHUB_PROBE_20261114"}' "$action" > /tmp/ngd-post.json
            curl -fLSs --connect-timeout 8 --max-time 30 \
              -H "Content-Type: text/plain;charset=utf-8" \
              -H "Origin: https://cuan74468-ux.github.io" \
              --data-binary @/tmp/ngd-post.json \
              --output /tmp/ngd-post-response.json "$NGD_GAS_URL"
            python3 - "$action" <<'PY'
          import json,sys
          action=sys.argv[1]
          with open('/tmp/ngd-post-response.json',encoding='utf-8') as f:d=json.load(f)
          if d.get('ok') is not True:
              print(action+'_ERROR_CODE:',(d.get('error') or {}).get('code','UNKNOWN'))
              raise SystemExit('READ_ONLY_POST_FAILED: '+action)
          info=d.get('data')
          if action=='getKatalog':
              if not isinstance(info,list):raise SystemExit('Unexpected catalog response type')
              print('LIVE_CATALOG_COUNT:',len(info))
          else:
              print('LIVE_PUBLIC_INFO_OK:',isinstance(info,dict))
          PY
          done
