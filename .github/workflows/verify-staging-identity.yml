name: Verify STAGING Apps Script identity (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-staging-identity.yml'
      - 'staging/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngd-verify-staging-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      STAGING_CANDIDATE_URL: 'https://script.google.com/macros/s/AKfycbyQYrRKN0mvIuoYFyWwQVNaA6Vc9hYYj4ycQSy3B1NXPJ4PbvbRIfZo7YVT4NL4IIlh/exec'
    steps:
      - name: Checkout for local production endpoint comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node 24 — read-only server attestation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Inspect publicly exposed API version and safety flags (GET)
        shell: bash
        run: |
          node <<'NODE'
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),20000);
          (async()=>{
            try {
              const response=await fetch(process.env.STAGING_CANDIDATE_URL,{
                redirect:'follow',signal:controller.signal
              });
              if(!response.ok)throw Error('HTTP '+response.status);
              const json=await response.json();
              if(json?.ok!==true || json?.data?.app!=='Ngulik Digital API')
                throw Error('Unexpected API health response');
              const d=json.data;
              console.log('STAGING_CANDIDATE_HEALTH: version='+String(d.version||'unknown').slice(0,24)+
                '; writes_enabled='+String(d.writes_enabled)+
                '; payments_enabled='+String(d.payments_enabled));
            }finally{clearTimeout(timer);}
          })().catch(e=>{console.error('STAGING_CANDIDATE_HEALTH_UNVERIFIED:',String(e.message).slice(0,120));process.exitCode=1;});
          NODE
      - name: Verify identity without login or writes
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const {randomUUID} = require('node:crypto');
          const candidate = process.env.STAGING_CANDIDATE_URL;
          const pattern = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{10,}\/exec$/;
          if(!pattern.test(candidate)) throw Error('Invalid Google Apps Script URL.');
          const productionConfig = fs.readFileSync('config.js','utf8');
          const match=productionConfig.match(/apiUrl:\s*'([^']+)'/);
          if(!match || candidate===match[1]) throw Error('STAGING endpoint must not equal production.');
          const stagingConfig = fs.readFileSync('staging/config.js','utf8');
          if(!stagingConfig.includes("apiUrl: '"+candidate+"'"))
            throw Error('The verified STAGING endpoint must match the deployed staging configuration.');
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),25000);
          (async()=>{
            try {
              const response=await fetch(candidate,{
                method:'POST',
                headers:{'Content-Type':'text/plain;charset=utf-8'},
                body:JSON.stringify({action:'getStagingWorkspaceInfo',payload:{},token:'',
                  request_id:randomUUID().replace(/-/g,'')+'aa'}),
                redirect:'follow',signal:controller.signal
              });
              if(!response.ok)throw Error('HTTP status '+response.status);
              let json;
              try{json=await response.json();}
              catch {throw Error('Non-JSON response; deployment may be unready.');}
              if(json?.ok!==true)throw Error('STAGING identity API rejected request; code='+
                String(json?.error?.code||'UNKNOWN').slice(0,30));
              const d=json.data;
              if(d?.workspace!=='NGD_STAGING'||d.environment!=='STAGING'||
                  d.admin_login_enabled!==true)
                throw Error('STAGING identity invariants failed.');
              for(const field of ['mutations_enabled','registration_enabled','otp_enabled','external_providers_enabled','finance_enabled']){
                if(typeof d[field]!=='boolean')
                  throw Error('STAGING identity flag invalid: '+field);
              }
              if(d.mutations_enabled!==true||d.registration_enabled!==true||d.otp_enabled!==true||d.external_providers_enabled!==true)
                throw Error('STAGING signup release gates are not all enabled.');
              console.log('STAGING_IDENTITY_VERIFIED: environment=STAGING; admin_login_enabled=true; mutations='+
                d.mutations_enabled+'; registration='+d.registration_enabled+
                '; otp='+d.otp_enabled+'; providers='+d.external_providers_enabled+'; finance='+d.finance_enabled);
            }finally{clearTimeout(timer);}
          })().catch(e=>{console.error('STAGING_IDENTITY_UNVERIFIED:',String(e.message).slice(0,180));process.exitCode=1;});
          NODE

      - name: Verify STAGING admin browser auto-connect (Chrome, read-only)
        shell: bash
        run: |
          set -euo pipefail
          cat > staging/ci-attestation-probe.js <<'JS'
          'use strict';
          (() => {
            let loops=0;
            const timer=setInterval(() => {
              const login=document.getElementById('login-section');
              const status=document.getElementById('connection-status');
              const alert=document.getElementById('alert');
              if(login && !login.hidden && status?.textContent==='STAGING terverifikasi') {
                document.body.setAttribute('data-staging-browser-attestation','pass');
                clearInterval(timer);
              }else if(++loops>=100){
                document.body.setAttribute('data-staging-browser-attestation','failed');
                document.body.setAttribute('data-staging-browser-failure',alert?.hidden?'timeout':'api-error');
                clearInterval(timer);
              }
            },150);
          })();
          JS
          sed -i 's#</body>#<script src="./ci-attestation-probe.js" defer></script></body>#' staging/monitor.html
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/staging-ci-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/staging/; then break; fi
            sleep 0.3
          done
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --window-size=1365,850 --dump-dom \
            "http://127.0.0.1:8765/staging/monitor.html" > /tmp/ngd-staging-attestation.html 2>/tmp/ngd-staging-ci-chrome.log
          if grep -q 'data-staging-browser-attestation="pass"' /tmp/ngd-staging-attestation.html; then
            echo 'STAGING_CHROME_LOGIN_GATE_OK: read-only identity authenticated in real browser; login form displayed without PIN'
          else
            echo 'STAGING_CHROME_LOGIN_GATE_FAIL: browser did not reach verified login gate' >&2
            grep -o 'data-staging-browser-failure="[^"]*"' /tmp/ngd-staging-attestation.html | tail -1 || true
            grep -E 'CORS|Access-Control|net::ERR' /tmp/ngd-staging-ci-chrome.log | tail -8 || true
            exit 1
          fi

      - name: Verify live STAGING signup form is enabled in Chrome (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > staging/ci-signup-probe.js <<'JS'
          (() => {
            let attempts=0;
            const timer=setInterval(() => {
              const form=document.querySelector('#auth-form[data-mode="register"]');
              const request=form?.querySelector('[data-action="otp-request"]');
              const verify=form?.querySelector('[data-action="otp-verify"]');
              if(form&&request&&!request.disabled&&verify&&!verify.disabled){
                document.body.setAttribute('data-staging-signup-ready','true');
                clearInterval(timer);
              }else if(++attempts>=125){
                document.body.setAttribute('data-staging-signup-ready','false');
                clearInterval(timer);
              }
            },120);
          })();
          JS
          sed -i 's#</body>#<script src="./ci-signup-probe.js" defer></script></body>#' staging/member.html
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ngd-signup-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/staging/member.html; then break; fi
            sleep 0.3
          done
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=19000 --window-size=390,844 --dump-dom \
            'http://127.0.0.1:8765/staging/member.html#daftar' > /tmp/ngd-live-signup.html 2>/tmp/ngd-live-signup-chrome.log
          if grep -q 'data-staging-signup-ready="true"' /tmp/ngd-live-signup.html; then
            echo 'STAGING_REGISTRATION_FORM_READY: server attested + OTP request and verification controls enabled; no OTP sent'
          else
            echo 'STAGING_REGISTRATION_NOT_READY: inspected deployed GAS release gates, no OTP sent' >&2
            grep -o 'data-staging-signup-ready="[^"]*"' /tmp/ngd-live-signup.html | tail -1 || true
            exit 1
          fi
