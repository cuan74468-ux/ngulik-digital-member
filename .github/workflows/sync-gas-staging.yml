name: Sync GAS STAGING (manual, drift-protected)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit first. Push requires explicit confirmation and complete source parity."
        type: choice
        options:
          - audit
          - push
        default: audit
        required: true
      confirmation:
        description: "For push ONLY, type: I_BACKED_UP_GAS_STAGING_V28_NO_PRODUCTION"
        type: string
        default: ""
        required: false
permissions:
  contents: read
concurrency:
  group: ngd-gas-staging-manual-sync
  cancel-in-progress: false
jobs:
  gas-staging:
    name: Verify real GAS editor against GitHub before optional upload
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Confirm explicit STAGING-only push consent
        env:
          SYNC_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$SYNC_MODE" == "push" && "$CONFIRMATION" != "I_BACKED_UP_GAS_STAGING_V28_NO_PRODUCTION" ]]; then
            echo "::error::Stop: first back up GAS STAGING v28 and type the exact confirmation phrase."
            exit 1
          fi
          [[ "$SYNC_MODE" == "push" || "$SYNC_MODE" == "audit" ]]
      - name: Validate checked-in source, do not run provider
        run: |
          set -euo pipefail
          node --check scripts/preflight-gas-staging-sync.cjs
          for file in apps-script/*.gs; do
            node --check --input-type=commonjs < "$file"
          done
          node -e "const x=require('./apps-script/appsscript.json');if(x.runtimeVersion!=='V8')process.exit(1)"
      - name: Install pinned official clasp 3.4.1
        run: npm install --global --no-audit --no-fund @google/clasp@3.4.1
      - name: Configure ephemeral STAGING credentials (never print)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_STAGING_SCRIPT_ID: ${{ secrets.GAS_STAGING_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$CLASPRC_JSON" || -z "$GAS_STAGING_SCRIPT_ID" ]]; then
            echo "::error::Missing required secret CLASPRC_JSON or GAS_STAGING_SCRIPT_ID."
            exit 1
          fi
          export GAS_STAGING_SCRIPT_ID
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          mkdir -p "_gas_remote"
          node <<'NODE'
          const fs=require('fs');
          const id=process.env.GAS_STAGING_SCRIPT_ID;
          if(!/^[A-Za-z0-9_-]{20,140}$/.test(id))throw Error('Invalid GAS STAGING script ID secret');
          fs.writeFileSync('_gas_remote/.clasp.json',JSON.stringify({scriptId:id,rootDir:'.'}),{mode:0o600});
          fs.writeFileSync('.clasp.json',JSON.stringify({scriptId:id,rootDir:'apps-script'}),{mode:0o600});
          NODE
      - name: Pull actual GAS STAGING editor HEAD into isolated runner
        shell: bash
        run: |
          set -euo pipefail
          ( cd _gas_remote && clasp pull )
          test -s _gas_remote/Code.gs
          test -s _gas_remote/appsscript.json
      - name: Compare ALL legacy code to actual remote GAS before any write
        run: node scripts/preflight-gas-staging-sync.cjs apps-script _gas_remote
      - name: Create immutable GAS recovery version, then push source ONLY
        if: inputs.mode == 'push'
        shell: bash
        run: |
          set -euo pipefail
          # Save current remote editor HEAD as a distinct GAS project version.
          # This does not redeploy/modify webapp v28; Apps Script versions are immutable.
          ( cd _gas_remote && clasp version "PRE_VISUAL_SYNC_$(git -C .. rev-parse --short HEAD)" )
          clasp push --force
          echo "GAS_STAGING_SOURCE_PUSHED_NO_DEPLOY"
      - name: Audit-only outcome
        if: inputs.mode == 'audit'
        run: echo "AUDIT_PASS_NO_GAS_WRITE — rerun with push only after independently verified v28 backup"
      - name: Delete temporary OAuth credentials and remote snapshot
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.clasprc.json" .clasp.json
          rm -rf _gas_remote
