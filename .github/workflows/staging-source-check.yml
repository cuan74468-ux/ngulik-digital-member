name: Staging Source Check
on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'apps-script/**'
      - 'index.html'
      - 'staging/**'
      - 'assets/**'
      - '.github/workflows/**'
      - 'SECURITY.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngd-staging-source-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node version
        run: node --version
      - name: Node syntax check (frontend and Apps Script)
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js staging/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
          for file in apps-script/*.gs; do
            echo "Checking GAS $file"
            node --check --input-type=commonjs < "$file"
          done
          echo "NODE_CHECK_PASS"
